# ============================================================
# Configuración general del proyecto
# Panel WhatsApp — Encuesta Permanente CISCo-IJD (UdelaR)
#
# Mismo esquema que el repo panel_IJD: acá va todo lo que es
# igual para TODO el proyecto; lo que cambia ronda a ronda va
# en DriveFlow/<ronda>.yml.
# ============================================================

project_name: "panel_cisco_ijd"     # usado en mensajes y nombres de archivo

# Ronda vigente (la leen los scripts para armar rutas)
ronda:
  round_id: "R1"
  year: 2026
  campaign: "r1_20260807"           # base del nombre de archivo en data/raw/campaigns_wcx/
  n_preguntas: 9                    # preguntas efectivas de la ronda (q10 vino vacía)

drive:
  # TODO: completar con la cuenta de Google que usa el Colab de Whisper
  account_email: "elina.gomez@cienciassociales.edu.uy"                 # ej: "usuario@gmail.com" -> drive_auth(email = ...)

  # Carpetas raíz en esa Drive para el intercambio con Colab.
  # Hay que crear a mano la subcarpeta <round_id> dentro de cada una.
  folder_audio: "A"                 # audios .ogg subidos, a la espera de transcribir
  folder_text: "B"                  # .txt que devuelve el Colab

  # TODO: carpeta de Drive con el spreadsheet "questions" (metadata de preguntas)
  questions_url: ""

# Defaults de codificación de preguntas abiertas con LLM (DriveFlow).
codificacion:
  provider: "openai"                # "openai" u "ollama" (modelo local)
  model: "gpt-5-nano"
  api_key_env: "OPENAI_API_KEY"
  ollama_base_url: "http://localhost:11434"
  chunk_size: 20

# Reglas de lectura del export de la plataforma (usadas por code/analisis_panel.R
# y code/prep_campaign.R). Ver README para el detalle.
export:
  patron_preguntas: "q[0-9]+$"
  patron_placeholder: "^(q[0-9]+|text|undefined|null|na|nan|-|\\.)$"
  min_placeholders_test: 5
