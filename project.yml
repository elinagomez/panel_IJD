# ============================================================
# Configuración general del proyecto
# Panel WhatsApp — Encuesta Permanente CISCo-IJD (UdelaR)
#
# Mismo esquema que el repo panel_IJD: acá va todo lo que es
# igual para TODO el proyecto; lo que cambia ronda a ronda va
# en DriveFlow/<ronda>.yml.
# ============================================================

project_name: "panel_cisco_ijd"     # usado en mensajes y nombres de archivo

# Ronda vigente (la leen los scripts para armar rutas)
ronda:
  round_id: "R1"
  year: 2026
  campaign: "r1_20260807"           # base del nombre de archivo en data/raw/campaigns_wcx/
  n_preguntas: 9                    # preguntas efectivas de la ronda (q10 vino vacía)

drive:
  account_email: "elina.gomez@cienciassociales.edu.uy"   # cuenta de drive_auth() y del Colab

  # Se trabaja con IDs y no con rutas por nombre: la carpeta del equipo está
  # compartida (no en "Mi unidad"), y ahí las rutas por nombre no resuelven.
  # El ID es lo que aparece en la URL de la carpeta, después de /folders/.

  folder_analisis_id: "15ZLihtbK7NPR-zUTow3LjBzUdgDAtMB8"  # carpeta Análisis del equipo
  folder_audio_id: "1OZ1ORV5T_q25_7z3pcVl1V65sfPAbau2"     # Análisis/A · audios .ogg a transcribir
  folder_text_id: "1UPQ0mFTCynyMJCzR18BP0hEdKG6CWYxY"      # Análisis/B · .txt que devuelve el Colab
  folder_codificacion_id: "1cabipmHVfNShlH0r1ec3aup3TN-TZ7fz"  # Análisis/C · intercambio de la codificación

  # Hoja de preguntas del proyecto, editable por el equipo
  questions_sheet: "https://docs.google.com/spreadsheets/d/1bbNI7fZcPPfdTvsgZWjHOXQUysT56VonXTk68IAVuiw"

# Defaults de codificación de preguntas abiertas con LLM (DriveFlow).
codificacion:
  provider: "ollama"                # "ollama" (local, no sale de la máquina) u "openai"
  model: "qwen3:4b"                 # ~2.5 GB · si el acuerdo del 20% no alcanza, subir a 8b
  # 127.0.0.1 y no "localhost": en Windows localhost puede resolver primero a
  # IPv6 (::1) mientras Ollama escucha solo en IPv4, y la conexión falla.
  ollama_base_url: "http://127.0.0.1:11434"
  api_key_env: "OPENAI_API_KEY"     # solo se usa si provider = "openai"

  temperature: 0                    # determinista: la misma respuesta da el mismo código
  seed: 20260810                    # para que la ronda sea reproducible
  think: false                      # Qwen3 razona por defecto; para clasificar no aporta
  max_active: 2                     # llamadas en paralelo (1 si la máquina se pone lenta)
  max_tokens: 128                   # la salida es un JSON corto de hasta 3 etiquetas

  # De dónde se leen la hoja de preguntas y el codebook:
  #   "drive" -> los edita el equipo, es la fuente de verdad
  #   "local" -> los xlsx de data/raw/codebook/, para probar sin conexión
  insumos: "drive"
  codebook_name: "LibroCodigos"     # un solo libro para el proyecto, en la carpeta Análisis
  codebook_tab: ""                  # vacío = la hoja que se llama igual que la ronda (R1, R2...)
  questions_sheet_tab: ""           # vacío = primera hoja
  tema_default: "desigualdad y justicia social en Uruguay"   # si TEMA y SubTema están vacíos

  # La base transcrita siempre se lee local: es la salida del paso anterior.
  raw_file: "data/processed/transcriptions/output/2026/transcripcion_R1.csv"
  questions_file: "data/raw/codebook/questions.xlsx"
  codebook_file: "data/raw/codebook/LibroCodigos.xlsx"
  out_dir: "data/processed/analysis/2026/R1"
  subir_a_drive: true               # sube los resultados a la carpeta Análisis

# Reglas de lectura del export de la plataforma (usadas por code/analisis_panel.R
# y code/prep_campaign.R). Ver README para el detalle.
export:
  patron_preguntas: "q[0-9]+$"
  patron_placeholder: "^(q[0-9]+|text|undefined|null|na|nan|-|\\.)$"
  min_placeholders_test: 5
