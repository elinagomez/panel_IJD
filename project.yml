# ============================================================
# Configuración general del proyecto
#
# Agrupa los parámetros que son iguales para TODO el proyecto
# (una cuenta de Drive, un cliente, una campaña de paneles),
# a diferencia de DriveFlow/<ronda>.yml que solo tiene lo que
# cambia ronda a ronda (folder_url de esa ronda, nombre de
# hoja de salida, etc).
#
# Al reutilizar este flujo para un proyecto nuevo, este es el
# único archivo que hace falta completar de punta a punta antes
# de correr nada. Los scripts (transcripciones.qmd, DriveFlow/*)
# leen estos valores en vez de tenerlos hardcodeados.
# ============================================================

project_name: "paneles"                # nombre corto del proyecto/cliente, usado en mensajes y nombres de archivo

drive:
  account_email: "soyfocusuy@gmail.com"  # cuenta de Google usada en drive_auth() (googledrive/googlesheets4)

  # Carpetas raíz en la Drive de esa cuenta, usadas por transcripciones.qmd
  # para el intercambio de audios con el Colab de Whisper.
  folder_audio: "A"                      # audios .ogg subidos, a la espera de ser transcritos
  folder_text: "B"                       # .txt transcritos que Colab deja disponibles para bajar

  # Carpeta en Drive con el spreadsheet "questions" (metadata de preguntas:
  # texto, tipo abierta/cerrada, dependencias, categorías). Es la misma
  # para todas las rondas de un mismo proyecto.
  questions_url: "https://drive.google.com/drive/u/0/folders/1Cmr-xzG4noYTjz36dI3jQNhIuWovg3OR"

# Defaults de clasificación (DriveFlow) para todas las rondas.
# Cada DriveFlow/<ronda>.yml puede sobreescribir cualquiera de estos
# campos si esa ronda puntual necesita otro modelo o proveedor.
codificacion:
  provider: "openai"        # "openai" o "ollama" (modelo local via Ollama, ver DriveFlow/README)
  model: "gpt-5-nano"
  api_key_env: "OPENAI_API_KEY"
  ollama_base_url: "http://localhost:11434"
  chunk_size: 20
